<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar administración · Basurto</title><link rel="stylesheet" href="/style.css"><script src="/recovery.js" defer></script></head><body><main><section class="login-form"><img class="brand-logo" src="/logo.png" alt="Autoescuela Basurto"><h1>Recuperar administración</h1><p>Elige una contraseña nueva. Se conservarán los datos y se cerrarán las sesiones anteriores de esta cuenta.</p><form id="recoveryForm"><label>Correo de administración<input name="username" type="email" autocomplete="username" required maxlength="100"></label><label>Clave privada de recuperación<input name="recovery" type="password" autocomplete="off" required maxlength="160"></label><label>Nueva contraseña (mínimo 12 caracteres)<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></label><label>Repite la contraseña<input name="confirmation" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></label><p id="error" class="formerror" role="alert"></p><button class="primary" type="submit">Guardar contraseña nueva</button></form><p id="success" role="status" hidden>Contraseña actualizada. Entra en Administración con tu nueva contraseña.</p><p><a href="/">Volver al acceso</a></p></section></main></body></html>
